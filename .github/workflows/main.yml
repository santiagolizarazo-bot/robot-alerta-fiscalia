name: Ejecución Automática Alertas

on:
  schedule:
    # 13:00 UTC = 8:00 AM Hora Colombia
    - cron: '0 13 * * *'
  workflow_dispatch: # Permite darle Play manualmente

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ⚠️ CRÍTICO: Da permiso para guardar el Excel

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Ejecutar el Robot
        run: python robot_fiscalia.py

      - name: Guardar el nuevo Excel en GitHub
        run: |
          git config --global user.name "Robot Fiscalia"
          git config --global user.email "bot@ejemplo.com"
          git add Alerta_Fiscalia.xlsx
          # Solo guarda si hay cambios
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Actualización diaria de alertas" && git push)
