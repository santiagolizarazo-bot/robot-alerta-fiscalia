name: Robot Fiscalia Rappi

on:
  schedule:
    - cron: '0 13 * * *' # 8:00 AM Colombia
  workflow_dispatch: 

permissions:
  contents: write # 👈 CRUCIAL: Permite que el robot suba archivos al repo

jobs:
  ejecutar-robot:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el script maestro
      run: python script_maestro.py # Asegúrate de que el script genere un archivo llamado 'resultados.xlsx'

    - name: Subir resultados al repositorio
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add resultados.xlsx
        git commit -m "Actualización diaria de hallazgos" || echo "Sin cambios para subir"
        git push
