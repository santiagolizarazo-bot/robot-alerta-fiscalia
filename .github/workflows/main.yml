name: Robot Fiscalia Rappi

on:
  schedule:
    # Esto significa: Correr todos los días a las 13:00 UTC (8:00 AM hora Colombia)
    - cron: '0 13 * * *' 
  workflow_dispatch: # Este botón nos permite correrlo manualmente cuando queramos

jobs:
  ejecutar-robot:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar el script maestro
      # OJO: Si tu archivo de Python se llama diferente, cámbialo aquí abajo
      run: python script_maestro.py
