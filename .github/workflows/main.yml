name: Ejecución Automática Alertas

on:
  schedule:
    # 10:00 UTC es 5:00 AM en Colombia. 
    # GitHub tendrá 3 horas de margen para cualquier retraso.
    - cron: '0 10 * * *'
  workflow_dispatch: # Mantiene el botón manual por si acaso

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # ESTO ES VITAL: Si no tiene permisos de escritura, no guarda el Excel
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Deps
        run: |
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run
        run: python robot_fiscalia.py

      - name: Save
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Alerta_Fiscalia.xlsx
          git commit -m "🤖 Alerta diaria automática" || echo "Sin cambios"
          git push
